[package]
name = "mutter_token"
version = "0.1.0"
description = "MutterCoin emission controller — capped mint for $MUTTER"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mutter_token"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
